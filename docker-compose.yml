services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess_app
    ports:
      - "5000:8080"
    volumes:
      - chess_data:/app/data
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/chess.db"
    restart: unless-stopped

volumes:
  chess_data:
