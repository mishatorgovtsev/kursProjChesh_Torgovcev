<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Chess Platform</title>
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .page {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* ── Profile card ── */
        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(201,168,76,.3), rgba(201,168,76,.1));
            border: 2px solid rgba(201,168,76,.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .profile-info { flex: 1; }

        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .profile-email {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .profile-meta { display: flex; gap: 20px; flex-wrap: wrap; }
        .meta-item { font-size: 13px; color: var(--text-muted); }
        .meta-item strong { color: var(--text); }

        .own-badge {
            display: inline-block;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(201,168,76,.15);
            color: var(--accent);
            border: 1px solid rgba(201,168,76,.3);
            margin-left: 10px;
            vertical-align: middle;
        }

        .rating-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(201,168,76,.1);
            border: 1px solid rgba(201,168,76,.3);
            border-radius: 12px;
            padding: 16px 24px;
            flex-shrink: 0;
        }
        .rating-badge .rating-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .rating-badge .rating-value {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--accent);
            line-height: 1;
        }

        /* ── Stats grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .stat-card.wins .stat-value   { color: var(--green); }
        .stat-card.losses .stat-value { color: var(--red); }
        .stat-card.draws .stat-value  { color: var(--blue); }
        .stat-card.total .stat-value  { color: var(--accent); }

        /* ── Win rate bar ── */
        .winrate-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .winrate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .winrate-title { font-weight: 600; }
        .winrate-pct   { color: var(--accent); font-weight: 700; font-size: 18px; }

        .winrate-bar {
            height: 10px;
            border-radius: 5px;
            background: var(--surface2);
            overflow: hidden;
            display: flex;
        }
        .winrate-bar .bar-wins   { background: var(--green); transition: width .6s ease; }
        .winrate-bar .bar-draws  { background: var(--blue);  transition: width .6s ease; }
        .winrate-bar .bar-losses { background: var(--red);   transition: width .6s ease; }

        .winrate-legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot  { width: 8px; height: 8px; border-radius: 50%; }

        /* ── History table ── */
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--text);
        }

        .history-table {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .history-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 80px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .history-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 80px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            transition: background .15s;
            align-items: center;
        }
        .history-row:last-child { border-bottom: none; }
        .history-row:hover { background: rgba(255,255,255,.02); }

        .opponent-link {
            cursor: pointer;
            color: var(--text);
            transition: color .15s;
        }
        .opponent-link:hover { color: var(--accent); text-decoration: underline; }

        .result-win  { color: var(--green); font-weight: 600; }
        .result-loss { color: var(--red);   font-weight: 600; }
        .result-draw { color: var(--blue);  font-weight: 600; }

        .change-positive { color: var(--green); font-weight: 600; }
        .change-negative { color: var(--red);   font-weight: 600; }

        /* ── Rating history ── */
        .rating-history-table {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .rh-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .rh-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            padding: 13px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            transition: background .15s;
        }
        .rh-row:last-child { border-bottom: none; }
        .rh-row:hover { background: rgba(255,255,255,.02); }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .loader {
            text-align: center;
            padding: 80px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">♟ Chess Platform</a>
    <div class="header-right">
        <span class="header-user" id="header-user"></span>
        <a href="/" class="btn btn-ghost">← Лобби</a>
        <a href="/tournament.html" class="btn btn-ghost">Турниры</a>
        <button class="btn btn-danger" id="logout-btn">Выйти</button>
    </div>
</header>

<div class="page">
    <div id="loader" class="loader">Загружаем профиль…</div>

    <div id="content" style="display:none">

        <!-- Profile card -->
        <div class="profile-card">
            <div class="avatar">♟</div>
            <div class="profile-info">
                <div class="profile-name">
                    <span id="p-username">—</span>
                    <span class="own-badge" id="own-badge" style="display:none">Вы</span>
                </div>
                <div class="profile-email" id="p-email">—</div>
                <div class="profile-meta">
                    <div class="meta-item">Зарегистрирован: <strong id="p-created">—</strong></div>
                    <div class="meta-item">Последний вход: <strong id="p-online">—</strong></div>
                </div>
            </div>
            <div class="rating-badge">
                <div class="rating-label">Рейтинг ELO</div>
                <div class="rating-value" id="p-rating">—</div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-value" id="p-total">0</div>
                <div class="stat-label">Партий</div>
            </div>
            <div class="stat-card wins">
                <div class="stat-value" id="p-wins">0</div>
                <div class="stat-label">Победы</div>
            </div>
            <div class="stat-card losses">
                <div class="stat-value" id="p-losses">0</div>
                <div class="stat-label">Поражения</div>
            </div>
            <div class="stat-card draws">
                <div class="stat-value" id="p-draws">0</div>
                <div class="stat-label">Ничьи</div>
            </div>
        </div>

        <!-- Win rate -->
        <div class="winrate-card">
            <div class="winrate-header">
                <span class="winrate-title">Процент побед</span>
                <span class="winrate-pct" id="p-winrate">0%</span>
            </div>
            <div class="winrate-bar">
                <div class="bar-wins"   id="bar-wins"   style="width:0%"></div>
                <div class="bar-draws"  id="bar-draws"  style="width:0%"></div>
                <div class="bar-losses" id="bar-losses" style="width:0%"></div>
            </div>
            <div class="winrate-legend">
                <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Победы</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Ничьи</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Поражения</div>
            </div>
        </div>

        <!-- Rating history -->
        <div class="section-title">История рейтинга</div>
        <div class="rating-history-table">
            <div class="rh-header">
                <span>Партия</span>
                <span>Рейтинг до</span>
                <span>Рейтинг после</span>
                <span>Изменение</span>
            </div>
            <div id="history-list">
                <div class="empty-state">История рейтинга пуста</div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/js/common.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var user = loadCurrentUser();
        if (!user) { window.location.href = '/'; return; }

        initHeader();

        var params = new URLSearchParams(window.location.search);
        var userId = parseInt(params.get('id')) || user.userId;

        // Показываем "Вы" если смотрим свой профиль
        if (userId === user.userId) {
            document.getElementById('own-badge').style.display = 'inline-block';
        }

        loadProfile(userId);
    });

    async function loadProfile(userId) {
        try {
            var res  = await fetch('/api/Users/' + userId);
            if (!res.ok) throw new Error('Пользователь не найден');
            var user = await res.json();

            document.title = user.username + ' — Chess Platform';
            document.getElementById('p-username').textContent = user.username;
            document.getElementById('p-email').textContent    = user.email || '—';
            document.getElementById('p-rating').textContent   = user.rating;
            document.getElementById('p-created').textContent  = formatDate(user.createdAt);
            document.getElementById('p-online').textContent   = formatDate(user.lastOnlineAt);
            document.getElementById('p-total').textContent    = user.gamesPlayed || 0;
            document.getElementById('p-wins').textContent     = user.wins   || 0;
            document.getElementById('p-losses').textContent   = user.losses || 0;
            document.getElementById('p-draws').textContent    = user.draws  || 0;

            var total   = user.gamesPlayed || 1;
            var winPct  = Math.round((user.wins   || 0) / total * 100);
            var drawPct = Math.round((user.draws  || 0) / total * 100);
            var lossPct = Math.round((user.losses || 0) / total * 100);

            document.getElementById('p-winrate').textContent       = winPct + '%';
            document.getElementById('bar-wins').style.width        = winPct  + '%';
            document.getElementById('bar-draws').style.width       = drawPct + '%';
            document.getElementById('bar-losses').style.width      = lossPct + '%';

            await loadRatingHistory(userId);

            document.getElementById('loader').style.display  = 'none';
            document.getElementById('content').style.display = 'block';

        } catch (e) {
            document.getElementById('loader').textContent = 'Ошибка загрузки профиля';
        }
    }

    async function loadRatingHistory(userId) {
        try {
            var res     = await fetch('/api/Users/' + userId + '/rating-history');
            if (!res.ok) return;
            var history = await res.json();
            var el      = document.getElementById('history-list');

            if (!history || !history.length) {
                el.innerHTML = '<div class="empty-state">История рейтинга пуста</div>';
                return;
            }

            el.innerHTML = history.map(function (h) {
                var change      = h.newRating - h.oldRating;
                var changeClass = change >= 0 ? 'change-positive' : 'change-negative';
                var changeText  = (change >= 0 ? '+' : '') + change;
                return '<div class="rh-row">' +
                    '<span>Партия #' + h.gameId + '</span>' +
                    '<span>' + h.oldRating + '</span>' +
                    '<span>' + h.newRating + '</span>' +
                    '<span class="' + changeClass + '">' + changeText + '</span>' +
                    '</div>';
            }).join('');
        } catch (e) {
            console.error('Ошибка загрузки истории:', e);
        }
    }
</script>
</body>
</html>
