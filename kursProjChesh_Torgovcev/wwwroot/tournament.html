<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турниры — Chess Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        :root { --pending: #5577cc; }
        .page { max-width: 1100px; margin: 0 auto; padding: 36px 24px; }
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
        .tab-btn { padding: 10px 20px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-muted); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .t-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .t-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: border-color .2s, transform .15s; }
        .t-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .t-card-title { font-family: "Playfair Display", serif; font-size: 17px; color: var(--accent); margin-bottom: 6px; }
        .t-card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; min-height: 18px; }
        .t-card-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
        .t-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
        .t-badge-reg  { background: rgba(85,119,204,.2);  color: #7799ee; }
        .t-badge-live { background: rgba(201,168,76,.15); color: var(--accent); }
        .t-badge-done { background: rgba(76,175,116,.1);  color: var(--green); }
        .t-card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); }
        .t-participants-bar { flex: 1; margin-right: 12px; }
        .t-participants-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .t-participants-track { height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; }
        .t-participants-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
        .create-form { max-width: 560px; }
        .create-form .field { margin-bottom: 16px; }
        .create-form .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
        .create-form input, .create-form select, .create-form textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; transition: border-color .2s; resize: vertical; }
        .create-form input:focus, .create-form select:focus, .create-form textarea:focus { border-color: var(--accent); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .detail-title { font-family: "Playfair Display", serif; font-size: 28px; color: var(--accent); margin-bottom: 6px; }
        .detail-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 12px; }
        .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .detail-stats { display: flex; gap: 24px; flex-wrap: wrap; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; }
        .detail-stat { font-size: 13px; color: var(--text-muted); }
        .detail-stat strong { display: block; font-size: 20px; color: var(--text); margin-bottom: 2px; }
        .participants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 24px; }
        .participant-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .participant-seed { font-size: 12px; font-weight: 700; color: var(--text-muted); width: 20px; }
        .participant-name { flex: 1; font-weight: 500; cursor: pointer; }
        .participant-name:hover { color: var(--accent); }
        .participant-rating { font-size: 12px; color: var(--accent); font-weight: 600; }
        .bracket-wrap { overflow-x: auto; padding-bottom: 16px; }
        .bracket { display: flex; gap: 0; align-items: flex-start; min-width: max-content; }
        .round-col { display: flex; flex-direction: column; }
        .round-label { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding: 0 8px 12px; min-width: 160px; }
        .round-matches { display: flex; flex-direction: column; }
        .match-card { width: 160px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color .2s; margin: 0 8px; }
        .match-card:hover { border-color: rgba(201,168,76,.4); }
        .match-card.is-final { border-color: rgba(201,168,76,.4); }
        .match-player { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .match-player:last-of-type { border-bottom: none; }
        .match-player.winner { background: rgba(201,168,76,.08); }
        .player-name.empty { color: var(--text-muted); font-style: italic; }
        .player-crown { color: var(--accent); font-size: 11px; font-weight: 700; }
        .match-status { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; padding: 4px; border-top: 1px solid var(--border); }
        .match-status.Pending { color: var(--text-muted); }
        .match-status.Ready { color: #7799ee; }
        .match-status.InProgress { color: var(--accent); }
        .match-status.Completed { color: var(--green); }
        .connector { display: flex; align-items: flex-start; }
        .winner-banner { display: none; text-align: center; padding: 32px; background: rgba(201,168,76,.07); border: 1px solid rgba(201,168,76,.3); border-radius: 16px; margin-bottom: 24px; }
        .winner-banner.visible { display: block; }
        .winner-banner .trophy { font-size: 48px; margin-bottom: 12px; }
        .winner-banner h2 { font-family: "Playfair Display", serif; font-size: 32px; color: var(--accent); margin-bottom: 6px; }
        .winner-banner p { color: var(--text-muted); font-size: 14px; }
        .modal-player-btn { width: 100%; padding: 14px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; margin-bottom: 10px; text-align: left; }
        .modal-player-btn:hover { border-color: var(--accent); background: rgba(201,168,76,.08); }
        .section-title { font-family: "Playfair Display", serif; font-size: 18px; color: var(--text); margin-bottom: 14px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; line-height: 1.6; }
        .loader { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; display: none; }
        .loader.visible { display: block; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; }
        .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(201,168,76,.08); }
        .filter-btn:hover:not(.active) { color: var(--text); }
        .back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-muted); font-family: inherit; font-size: 14px; cursor: pointer; padding: 0; margin-bottom: 20px; transition: color .2s; }
        .back-btn:hover { color: var(--accent); }
        .btn-start-disabled { opacity: .4; cursor: not-allowed !important; }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">♟ Chess Platform</a>
    <div class="header-right">
        <a href="/" class="btn btn-ghost">Главная</a>
        <span class="header-user" id="header-user"></span>
        <button class="btn btn-danger" id="logout-btn">Выйти</button>
    </div>
</header>

<div class="page">
    <div id="view-list">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('list')">Все турниры</button>
            <button class="tab-btn" onclick="switchTab('create')">+ Создать турнир</button>
        </div>
        <div class="tab-content active" id="tab-list">
            <div class="filter-bar">
                <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
                <button class="filter-btn" onclick="setFilter('Registration', this)">Регистрация</button>
                <button class="filter-btn" onclick="setFilter('InProgress', this)">Идут</button>
                <button class="filter-btn" onclick="setFilter('Completed', this)">Завершены</button>
            </div>
            <div class="loader" id="list-loader">Загрузка...</div>
            <div class="t-grid" id="tournaments-grid"></div>
        </div>
        <div class="tab-content" id="tab-create">
            <div class="create-form">
                <div class="field"><label>Название турнира</label><input type="text" id="c-title" placeholder="Весенний турнир 2025"></div>
                <div class="field"><label>Описание (необязательно)</label><textarea id="c-desc" rows="2" placeholder="Открытый турнир..."></textarea></div>
                <div class="form-row">
                    <div class="field"><label>Макс. участников</label>
                        <select id="c-max"><option value="4">4 игрока</option><option value="8" selected>8 игроков</option><option value="16">16 игроков</option><option value="32">32 игрока</option></select>
                    </div>
                    <div class="field"><label>Контроль времени</label>
                        <select id="c-time"><option value="5">5 мин</option><option value="10" selected>10 мин</option><option value="15">15 мин</option><option value="30">30 мин</option><option value="90">90 мин</option></select>
                    </div>
                </div>
                <div class="field"><label>Дата начала</label><input type="datetime-local" id="c-date"></div>
                <div id="create-error" style="color:var(--red);font-size:13px;margin-bottom:10px;min-height:18px"></div>
                <button class="btn btn-primary" id="create-btn" style="width:100%;padding:12px;font-size:15px" onclick="createTournament()">♟ Создать турнир</button>
            </div>
        </div>
    </div>

    <div id="view-detail" style="display:none">
        <button class="back-btn" onclick="showList()">&#8592; Все турниры</button>
        <div class="detail-header">
            <div>
                <div class="detail-title" id="d-title">-</div>
                <div class="detail-desc" id="d-desc"></div>
                <span class="t-badge" id="d-badge"></span>
            </div>
            <div class="detail-actions">
                <button class="btn btn-primary" id="btn-join"  onclick="joinTournament()"  style="display:none">Записаться</button>
                <button class="btn btn-danger"  id="btn-leave" onclick="leaveTournament()" style="display:none">Отписаться</button>
                <button class="btn btn-primary" id="btn-start" onclick="startTournament()" style="display:none">&#9654; Запустить</button>
            </div>
        </div>
        <div class="detail-stats">
            <div class="detail-stat"><strong id="d-participants">-</strong>Участников</div>
            <div class="detail-stat"><strong id="d-max">-</strong>Макс. мест</div>
            <div class="detail-stat"><strong id="d-rounds">-</strong>Раундов</div>
            <div class="detail-stat"><strong id="d-time">-</strong>Мин./партия</div>
            <div class="detail-stat"><strong id="d-starts">-</strong>Начало</div>
        </div>
        <div id="participants-section">
            <div class="section-title">Участники</div>
            <div class="participants-grid" id="participants-grid"></div>
        </div>
        <div class="winner-banner" id="winner-banner">
            <div class="trophy">&#127942;</div>
            <h2 id="winner-name">-</h2>
            <p>Победитель турнира</p>
        </div>
        <div id="bracket-section" style="display:none">
            <div class="section-title">Турнирная сетка</div>
            <div class="loader visible" id="bracket-loader">Загрузка сетки...</div>
            <div class="bracket-wrap"><div class="bracket" id="bracket-container"></div></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="match-modal">
    <div class="modal">
        <h3>Выбрать победителя</h3>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Кто победил в этом матче?</p>
        <div id="modal-players"></div>
        <button class="btn btn-ghost" style="width:100%;margin-top:4px" onclick="closeModal()">Отмена</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/common.js"></script>
<script src="/js/tournament.js"></script>
</body>
</html>
