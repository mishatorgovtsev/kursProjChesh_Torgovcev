<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Platform — Лобби</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        /* ── Lobby layout ── */
        .page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 36px 24px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--text);
            margin-bottom: 28px;
        }

        .lobby-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
        }

        /* ── New game form ── */
        .new-game-form { padding: 20px; }

        .select-field { margin-bottom: 16px; }

        .select-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color .2s;
        }
        select:focus { border-color: var(--accent); }

        .training-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .training-row input[type="checkbox"] {
            width: 18px; height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }
        .training-row label {
            font-size: 14px;
            cursor: pointer;
            color: var(--text);
        }

        /* ── Games list ── */
        .game-row {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
            cursor: pointer;
            transition: background .15s;
        }
        .game-row:last-child { border-bottom: none; }
        .game-row:hover { background: rgba(255,255,255,.03); }

        .game-players { flex: 1; font-size: 14px; font-weight: 500; }
        .game-players span { color: var(--text-muted); font-weight: 400; }
        .game-mine { color: var(--accent); font-size: 11px; margin-left: 6px; }

        /* ── Leaderboard ── */
        .leader-row {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            gap: 12px;
        }
        .leader-row:last-child { border-bottom: none; }

        .leader-rank { width: 24px; font-weight: 700; color: var(--text-muted); font-size: 13px; }
        .leader-rank.gold   { color: #ffd700; }
        .leader-rank.silver { color: #c0c0c0; }
        .leader-rank.bronze { color: #cd7f32; }

        .leader-name {
            flex: 1;
            font-weight: 500;
            cursor: pointer;
            transition: color .15s;
        }
        .leader-name:hover { color: var(--accent); }
        .leader-wins   { color: var(--text-muted); font-size: 12px; }
        .leader-rating { color: var(--accent); font-weight: 600; font-size: 13px; }

        /* ── Tournaments panel ── */
        .tournament-row {
            display: flex;
            align-items: center;
            padding: 13px 20px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
            cursor: pointer;
            transition: background .15s;
        }
        .tournament-row:last-child { border-bottom: none; }
        .tournament-row:hover { background: rgba(255,255,255,.03); }
        .tournament-name { flex: 1; font-size: 14px; font-weight: 500; }
        .tournament-players { font-size: 12px; color: var(--text-muted); }

        .t-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .t-badge-reg  { background: rgba(85,119,204,.2); color: #7799ee; }
        .t-badge-live { background: rgba(201,168,76,.15); color: var(--accent); }
        .t-badge-done { background: rgba(76,175,116,.1);  color: var(--green); }

        /* ── Auth modal ── */
        .auth-box {
            width: 400px;
            max-width: 95vw;
        }

        .auth-logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: var(--accent);
            text-align: center;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 22px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .2s;
        }
        .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-form .btn-primary { width: 100%; padding: 12px; margin-top: 4px; font-size: 15px; }

        .form-error {
            color: var(--red);
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
        }

        /* ── Refresh hint ── */
        .panel-header .refresh-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color .15s;
        }
        .panel-header .refresh-btn:hover { color: var(--accent); }
    </style>
</head>
<body>

<!-- ── Header ── -->
<header id="main-header" style="display:none">
    <a class="logo" href="/">♟ Chess Platform</a>
    <div class="header-right">
        <span class="header-user" id="header-user"></span>
        <a href="/tournament.html" class="btn btn-ghost">Турниры</a>
        <button class="btn btn-danger" id="logout-btn">Выйти</button>
    </div>
</header>

<!-- ── Lobby ── -->
<main id="lobby" class="page" style="display:none">
    <h2 class="page-title">Лобби</h2>

    <div class="lobby-grid">
        <!-- Левая колонка -->
        <div>
            <!-- Новая игра -->
            <div class="panel" style="margin-bottom:20px">
                <div class="panel-header">
                    <span>Новая игра</span>
                </div>
                <div class="new-game-form">
                    <div class="select-field">
                        <label>Противник</label>
                        <select id="opponent-select">
                            <option value="">Загрузка игроков…</option>
                        </select>
                    </div>
                    <div class="select-field">
                        <label>Контроль времени</label>
                        <select id="time-select">
                            <option value="5">5 минут (блиц)</option>
                            <option value="10" selected>10 минут</option>
                            <option value="15">15 минут</option>
                            <option value="30">30 минут</option>
                            <option value="90">90 минут (классика)</option>
                        </select>
                    </div>
                    <div class="training-row">
                        <input type="checkbox" id="training-mode">
                        <label for="training-mode">Режим тренировки (играть за обоих)</label>
                    </div>
                    <button class="btn btn-primary" style="width:100%" onclick="createGame()">
                        ♟ Создать игру
                    </button>
                </div>
            </div>

            <!-- Активные игры -->
            <div class="panel" style="margin-bottom:20px">
                <div class="panel-header">
                    <span>Активные игры</span>
                    <span style="display:flex;align-items:center;gap:8px">
                        <span id="games-count" style="color:var(--text-muted);font-size:12px;font-weight:400"></span>
                        <button class="refresh-btn" onclick="loadActiveGames()" title="Обновить">↻</button>
                    </span>
                </div>
                <div id="games-list">
                    <div class="empty-list">Загрузка…</div>
                </div>
            </div>

            <!-- Турниры -->
            <div class="panel">
                <div class="panel-header">
                    <span>Турниры</span>
                    <a href="/tournament.html" style="font-size:12px;color:var(--accent);text-decoration:none;font-weight:400">
                        Все турниры →
                    </a>
                </div>
                <div id="tournaments-list">
                    <div class="empty-list">Загрузка…</div>
                </div>
            </div>
        </div>

        <!-- Правая колонка — лидерборд -->
        <div>
            <div class="panel">
                <div class="panel-header">
                    <span>Таблица лидеров</span>
                    <button class="refresh-btn" onclick="loadLeaderboard()" title="Обновить">↻</button>
                </div>
                <div id="leaderboard-list">
                    <div class="empty-list">Загрузка…</div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- ── Auth modal ── -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal auth-box">
        <div class="auth-logo">♟ Chess Platform</div>
        <div class="auth-subtitle">Войдите чтобы начать игру</div>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
        </div>

        <!-- Вход -->
        <div class="auth-form active" id="login-form">
            <div class="field">
                <label>Имя пользователя</label>
                <input type="text" id="login-username" placeholder="Введите имя"
                    onkeydown="if(event.key==='Enter')doLogin()">
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль"
                    onkeydown="if(event.key==='Enter')doLogin()">
            </div>
            <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Войти</button>
            <div class="form-error" id="login-error"></div>
        </div>

        <!-- Регистрация -->
        <div class="auth-form" id="register-form">
            <div class="field">
                <label>Имя пользователя</label>
                <input type="text" id="reg-username" placeholder="Придумайте имя">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="your@email.com">
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" id="reg-password" placeholder="Минимум 6 символов">
            </div>
            <button class="btn btn-primary" id="reg-btn" onclick="doRegister()">Зарегистрироваться</button>
            <div class="form-error" id="reg-error"></div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/js/common.js"></script>
<script src="/js/lobby.js"></script>
</body>
</html>
