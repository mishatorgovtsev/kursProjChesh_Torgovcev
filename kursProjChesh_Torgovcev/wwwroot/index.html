<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg: #0f0f13;
            --surface: #1a1a22;
            --surface2: #22222e;
            --border: #2e2e3e;
            --accent: #c9a84c;
            --accent2: #e8c96a;
            --text: #e8e8f0;
            --text-muted: #7a7a9a;
            --green: #4caf74;
            --red: #e05555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-user {
            font-size: 14px;
            color: var(--text-muted);
        }

        .header-user strong { color: var(--accent); }

        .btn {
            padding: 9px 18px;
            border-radius: 8px;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-primary { background: var(--accent); color: #111; }
        .btn-primary:hover { background: var(--accent2); }
        .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(224,85,85,.3); }
        .btn-danger:hover { background: rgba(224,85,85,.1); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        /* ── Screens ── */
        .screen { display: none; }
        .screen.active { display: block; }

        /* ── Auth ── */
        #auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 380px;
        }

        .auth-box h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-box .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .2s;
        }

        .auth-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .auth-form { display: none; }
        .auth-form.active { display: block; }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }

        .field input:focus { border-color: var(--accent); }

        .auth-form .btn-primary { width: 100%; padding: 12px; margin-top: 6px; font-size: 15px; }

        .form-error {
            color: var(--red);
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
        }

        /* ── Lobby ── */
        #lobby-screen {
            max-width: 1000px;
            margin: 0 auto;
            padding: 36px 24px;
        }

        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .lobby-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--text);
        }

        .lobby-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        /* Panel */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* New game form */
        .new-game-form {
            padding: 20px;
        }

        .select-field {
            margin-bottom: 16px;
        }

        .select-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color .2s;
        }
        select:focus { border-color: var(--accent); }

        /* Leaderboard */
        .leader-row {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            gap: 12px;
        }

        .leader-row:last-child { border-bottom: none; }

        .leader-rank {
            width: 24px;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 13px;
        }

        .leader-rank.gold   { color: #ffd700; }
        .leader-rank.silver { color: #c0c0c0; }
        .leader-rank.bronze { color: #cd7f32; }

        .leader-name { flex: 1; font-weight: 500; }
        .leader-rating { color: var(--accent); font-weight: 600; font-size: 13px; }
        .leader-wins { color: var(--text-muted); font-size: 12px; }

        /* Active games list */
        .game-row {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
            cursor: pointer;
            transition: background .15s;
        }

        .game-row:last-child { border-bottom: none; }
        .game-row:hover { background: rgba(255,255,255,.03); }

        .game-players {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        .game-players span { color: var(--text-muted); font-weight: 400; }

        .game-status {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .game-status.Pending    { background: rgba(85,119,204,.15); color: #7799ee; }
        .game-status.InProgress { background: rgba(201,168,76,.1);  color: var(--accent); }
        .game-status.Completed  { background: rgba(76,175,116,.1);  color: var(--green); }

        .empty-list {
            padding: 32px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ── Game screen ── */
        #game-screen {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        .game-layout {
            display: grid;
            grid-template-columns: auto 280px;
            gap: 24px;
            align-items: start;
        }

        /* Board area */
        .board-area {}

        .player-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 4px;
        }

        .player-bar .name {
            font-weight: 600;
            font-size: 15px;
        }

        .player-bar .name.you { color: var(--accent); }

        .timer-display {
            font-family: 'DM Sans', monospace;
            font-size: 22px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            transition: all .3s;
            min-width: 90px;
            text-align: center;
        }

        .timer-display.active {
            background: rgba(201,168,76,.12);
            border-color: rgba(201,168,76,.4);
            color: var(--accent);
        }

        .timer-display.low { color: var(--red) !important; border-color: rgba(224,85,85,.4) !important; }

        #board-container {
            margin: 4px 0;
        }

        /* Side panel */
        .side-panel {}

        .move-history {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .move-history .panel-header { padding: 14px 16px; }

        .moves-list {
            padding: 12px 16px;
            max-height: 260px;
            overflow-y: auto;
            font-size: 13px;
            font-family: 'DM Sans', monospace;
        }

        .move-pair {
            display: flex;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,.04);
        }

        .move-num { color: var(--text-muted); width: 28px; }
        .move-w, .move-b { flex: 1; }

        .game-status-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .turn-indicator {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .turn-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .game-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 14px;
            z-index: 200;
            transform: translateY(80px);
            opacity: 0;
            transition: all .3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: var(--green); color: var(--green); }
        .toast.error   { border-color: var(--red);   color: var(--red); }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 32px;
            width: 360px;
            max-width: 95vw;
        }
        .modal h3 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 20px;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }

        /* chessboard override */
        .board-b72b1 { border-radius: 4px; overflow: hidden; }
    </style>
</head>
<!-- Promotion modal -->
<div class="modal-overlay" id="promotion-modal">
    <div class="modal" style="text-align:center">
        <h3>Превращение пешки</h3>
        <p style="color:var(--text-muted);font-size:14px;margin-bottom:20px">Выберите фигуру</p>
        <div style="display:flex;gap:12px;justify-content:center">
            <button class="btn btn-ghost" style="font-size:28px;padding:12px 16px" onclick="selectPromotion('q')">♛</button>
            <button class="btn btn-ghost" style="font-size:28px;padding:12px 16px" onclick="selectPromotion('r')">♜</button>
            <button class="btn btn-ghost" style="font-size:28px;padding:12px 16px" onclick="selectPromotion('b')">♝</button>
            <button class="btn btn-ghost" style="font-size:28px;padding:12px 16px" onclick="selectPromotion('n')">♞</button>
        </div>
    </div>
</div>
<body>

<!-- Header (hidden on auth) -->
<header id="main-header" style="display:none">
    <div class="logo">♟ Chess Platform</div>
    <div class="header-right">
        <span class="header-user" id="header-user"></span>
        <a href="/tournament.html" style="text-decoration:none">
            <button class="btn btn-ghost">Турниры</button>
        </a>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
</header>

<!-- ══════════════ AUTH SCREEN ══════════════ -->
<div id="auth-screen">
    <div class="auth-box">
        <h1>♟ Chess Platform</h1>
        <p class="subtitle">Войдите чтобы начать игру</p>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
        </div>

        <!-- Login -->
        <div class="auth-form active" id="login-form">
            <div class="field">
                <label>Имя пользователя</label>
                <input type="text" id="login-username" placeholder="Введите имя" onkeydown="if(event.key==='Enter')login()">
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль" onkeydown="if(event.key==='Enter')login()">
            </div>
            <button class="btn btn-primary" id="login-btn" onclick="login()">Войти</button>
            <div class="form-error" id="login-error"></div>
        </div>

        <!-- Register -->
        <div class="auth-form" id="register-form">
            <div class="field">
                <label>Имя пользователя</label>
                <input type="text" id="reg-username" placeholder="Придумайте имя">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="your@email.com">
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" id="reg-password" placeholder="Минимум 6 символов">
            </div>
            <button class="btn btn-primary" id="reg-btn" onclick="register()">Зарегистрироваться</button>
            <div class="form-error" id="reg-error"></div>
        </div>
    </div>
</div>

<!-- ══════════════ LOBBY SCREEN ══════════════ -->
<div id="lobby-screen" class="screen">
    <div class="lobby-header">
        <h2>Лобби</h2>
        <button class="btn btn-ghost" onclick="loadLobby()">↻ Обновить</button>
    </div>

    <div class="lobby-grid">
        <!-- Left: New game + active games -->
        <div>
            <!-- Create game -->
            <div class="panel" style="margin-bottom:20px">
                <div class="panel-header">Новая игра</div>
                <div class="new-game-form">
                    <div class="select-field">
                        <label>Противник</label>
                        <select id="opponent-select">
                            <option value="">Загрузка игроков…</option>
                        </select>
                    </div>
                    <div class="select-field">
                        <label>Контроль времени</label>
                        <select id="time-select">
                            <option value="5">5 минут (блиц)</option>
                            <option value="10" selected>10 минут</option>
                            <option value="15">15 минут</option>
                            <option value="30">30 минут</option>
                            <option value="90">90 минут (классика)</option>
                        </select>
                    </div>
                    <div class="select-field" style="display:flex;align-items:center;gap:10px">
                        <input type="checkbox" id="training-mode" style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent)">
                        <label for="training-mode" style="text-transform:none;letter-spacing:0;font-size:14px;cursor:pointer;color:var(--text)">
                            Режим тренировки (играть за обоих)
                        </label>
                    </div>
                    <button class="btn btn-primary" style="width:100%" onclick="createGame()">
                        ♟ Создать игру
                    </button>
                </div>
            </div>

            <!-- Active games -->
            <div class="panel">
                <div class="panel-header">
                    <span>Активные игры</span>
                    <span id="games-count" style="color:var(--text-muted);font-size:12px;font-weight:400"></span>
                </div>
                <div id="games-list">
                    <div class="empty-list">Загрузка…</div>
                </div>
            </div>
        </div>

        <!-- Right: Leaderboard -->
        <div>
            <div class="panel">
                <div class="panel-header">Таблица лидеров</div>
                <div id="leaderboard-list">
                    <div class="empty-list">Загрузка…</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ══════════════ GAME SCREEN ══════════════ -->
<div id="game-screen" class="screen">
    <div class="game-layout">
        <!-- Board -->
        <div class="board-area">
            <!-- Black player (top) -->
            <div class="player-bar">
                <span class="name" id="black-player-name">Чёрные</span>
                <div class="timer-display" id="black-timer">10:00</div>
            </div>

            <div id="board-container">
                <div id="board" style="width:460px"></div>
            </div>

            <!-- White player (bottom) -->
            <div class="player-bar">
                <span class="name you" id="white-player-name">Белые</span>
                <div class="timer-display active" id="white-timer">10:00</div>
            </div>
        </div>

        <!-- Side panel -->
        <div class="side-panel">
            <div class="game-status-bar">
                <div class="turn-indicator">Ход:</div>
                <div class="turn-name" id="turn-name">Белые</div>
            </div>

            <div class="move-history">
                <div class="panel-header">История ходов</div>
                <div class="moves-list" id="moves-list">
                    <span style="color:var(--text-muted);font-size:13px">Ходов ещё нет</span>
                </div>
            </div>

            <div class="game-actions">
                <button class="btn btn-ghost" onclick="undoMove()">↩ Отменить ход</button>
                <button class="btn btn-ghost" onclick="goToLobby()">← В лобби</button>
            </div>
        </div>
    </div>
</div>

<!-- Game over modal -->
<div class="modal-overlay" id="gameover-modal">
    <div class="modal">
        <h3 id="gameover-title">Игра окончена</h3>
        <p id="gameover-text" style="color:var(--text-muted);font-size:14px"></p>
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="goToLobby()">В лобби</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
